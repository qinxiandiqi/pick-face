---
# mkdocs configuration for the pick-face documentation site.
#
# Build locally:
#     uv pip install -e ".[docs]"
#     uv run mkdocs serve     # local preview at http://127.0.0.1:8000
#     uv run mkdocs build     # static site under site/
#
# Deploy: see .github/workflows/docs.yml (T-303).
site_name: pick-face
site_description: Local offline image face recognition & organization CLI
site_url: https://qinxiandiqi.github.io/pick-face/
repo_url: https://github.com/qinxiandiqi/pick-face
repo_name: qinxiandiqi/pick-face
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - License & compliance:
      - Commercial compliance: 11-commercial-compliance.md
  - Product & planning:
      - Product requirement: 01-product-requirement.md
      - Engineering plan: 06-engineering-plan.md
  - Architecture & data:
      - Architecture design: 03-architecture-design.md
      - Algorithm pipeline: 04-algorithm-pipeline.md
      - Data & storage: 05-data-and-storage.md
      - Face recognition walkthrough: 09-face-recognition-pipeline.md
      - Model stack: 10-model-stack.md
  - Research & decisions:
      - Technical pre-research: 02-technical-pre-research.md
      - Risks & decisions: 07-risk-and-decisions.md
      - Review notes: 08-review-notes.md
  - Troubleshooting: troubleshooting.md
  - AGENTS index: AGENTS.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/qinxiandiqi/pick-face