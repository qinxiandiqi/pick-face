name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref so rapid pushes don't queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint — ruff check + format check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --extra dev --frozen

      - name: ruff check
        run: uv run ruff check src tests

      - name: ruff format --check
        run: uv run ruff format --check src tests

  # ---------------------------------------------------------------------------
  # 2. Unit tests + acceptance (incl. AC-9 guard)
  # ---------------------------------------------------------------------------
  unit:
    name: Unit + acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --extra dev --frozen

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit tests/acceptance \
            --cov=pick_face --cov-report=xml --cov-report=term -q

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3. Smoke tests on three OSes (Linux, Windows, macOS)
  # ---------------------------------------------------------------------------
  smoke-linux:
    name: Smoke (ubuntu)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync project
        run: uv sync --frozen

      - name: Smoke: init-models refusal path
        run: python tests/smoke_cli_init_models.py

      - name: Smoke: scan
        run: python tests/smoke_cli_scan.py

      - name: Smoke: index
        run: python tests/smoke_cli_index.py

      - name: Smoke: link
        run: python tests/smoke_cli_link.py

      - name: Smoke: report
        run: python tests/smoke_cli_report.py

  smoke-windows:
    name: Smoke (windows)
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync project
        run: uv sync --frozen

      - name: Smoke: init-models refusal path
        shell: bash
        run: python tests/smoke_cli_init_models.py

      - name: Smoke: scan
        shell: bash
        run: python tests/smoke_cli_scan.py

      - name: Smoke: index
        shell: bash
        run: python tests/smoke_cli_index.py

      - name: Smoke: link
        shell: bash
        run: python tests/smoke_cli_link.py

      - name: Smoke: report
        shell: bash
        run: python tests/smoke_cli_report.py

  smoke-macos:
    name: Smoke (macos)
    needs: unit
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync project
        run: uv sync --frozen

      - name: Smoke: init-models refusal path
        run: python tests/smoke_cli_init_models.py

      - name: Smoke: scan
        run: python tests/smoke_cli_scan.py

      - name: Smoke: index
        run: python tests/smoke_cli_index.py

      - name: Smoke: link
        run: python tests/smoke_cli_link.py

      - name: Smoke: report
        run: python tests/smoke_cli_report.py

  # ---------------------------------------------------------------------------
  # 4. Benchmark — pick-face bench writes perf_report.{json,md}
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmark
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --extra dev --frozen

      - name: Run benchmark (small workload for CI)
        run: |
          mkdir -p .benchmarks/ci
          uv run python -m pick_face.bench --n-embeddings 2000 --k-people 10 --dim 128 --seed 0 \
            --out .benchmarks/ci || true
          # The bench module's CLI may not exist; if not, fall back to the python entry.
          if [ ! -f .benchmarks/ci/perf_report.json ]; then
            uv run python -c "from pick_face.bench import run_benchmark, write_report; from pathlib import Path; write_report(run_benchmark(n_embeddings=2000, k_people=10, dim=128, seed=0), Path('.benchmarks/ci'))"
          fi

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: .benchmarks/ci/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 5. AC-9 guard — dedicated job so it runs even if smoke is skipped
  #    The same guard runs inside `unit` (acceptance/test_no_model_in_distribution),
  #    but we promote it here so it can never silently disappear.
  # ---------------------------------------------------------------------------
  ac9:
    name: AC-9 (no *.onnx in distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync project
        run: uv sync --frozen

      - name: AC-9 guard
        run: |
          uv run python -m pytest tests/acceptance/test_no_model_in_distribution.py -v

      - name: Verify no Dockerfile bakes ONNX
        run: |
          if find . -name 'Dockerfile*' -not -path './.venv/*' -not -path './.git/*' -print -quit | grep -q .; then
            ! grep -rilE '\.onnx(\b|[^a-z])' --include='Dockerfile*' . || \
              (echo "AC-9 violation: Dockerfile references .onnx" && exit 1)
          fi