name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref so rapid pushes don't queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint — ruff check + format check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev dependencies
        working-directory: packages/pick-face
        run: uv sync --extra dev --frozen

      - name: ruff check
        working-directory: packages/pick-face
        run: uv run ruff check src tests

      - name: ruff format --check
        working-directory: packages/pick-face
        run: uv run ruff format --check src tests

  # ---------------------------------------------------------------------------
  # 1b. Frontend — Vite build → `packages/pick-face/src/pick_face/web/static/`
  #     so the wheel built later contains the SPA bundle. Pnpm cache keyed
  #     on the workspace lockfile at the monorepo root.
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend (vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - working-directory: packages/web-ui
        run: pnpm install --frozen-lockfile

      - working-directory: packages/web-ui
        run: pnpm build

      - name: Verify vite emitted PWA + shell artifacts (M7.9)
        run: |
          test -f packages/pick-face/src/pick_face/web/static/index.html
          test -f packages/pick-face/src/pick_face/web/static/manifest.webmanifest
          test -f packages/pick-face/src/pick_face/web/static/sw.js
          test -f packages/pick-face/src/pick_face/web/static/registerSW.js
          test -f packages/pick-face/src/pick_face/web/static/icons/icon-192.png
          test -f packages/pick-face/src/pick_face/web/static/icons/icon-512.png
          test -f packages/pick-face/src/pick_face/web/static/icons/icon-mask.png

      - name: AC-9 frontend guard (no *.onnx refs in SPA source)
        run: |
          ! find packages/web-ui/src -iname '*.onnx' -print -quit | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: web-static
          path: packages/pick-face/src/pick_face/web/static
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 1c. Frontend tests — Vitest + Testing Library (jsdom).
  #     Depends on `frontend-build` so `web/static/` exists when the test
  #     artifact guard runs (test_vite_build_artifacts.py).
  # ---------------------------------------------------------------------------
  frontend-test:
    name: Frontend (vitest)
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - working-directory: packages/web-ui
        run: pnpm install --frozen-lockfile

      - working-directory: packages/web-ui
        run: pnpm test

  # ---------------------------------------------------------------------------
  # 2. Unit tests + acceptance (incl. AC-9 guard)
  # ---------------------------------------------------------------------------
  unit:
    name: Unit + acceptance tests
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev dependencies
        working-directory: packages/pick-face
        run: uv sync --extra dev --frozen

      - name: Run unit tests with coverage
        working-directory: packages/pick-face
        run: |
          uv run pytest tests/unit tests/acceptance \
            --cov=pick_face --cov-report=xml --cov-report=term -q

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: packages/pick-face/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3. Smoke tests on three OSes (Linux, Windows, macOS)
  # ---------------------------------------------------------------------------
  smoke-linux:
    name: Smoke (ubuntu)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync project
        working-directory: packages/pick-face
        run: uv sync --frozen

      - name: 'Smoke: init-models refusal path'
        working-directory: packages/pick-face
        run: python tests/smoke_cli_init_models.py

      - name: 'Smoke: scan'
        working-directory: packages/pick-face
        run: python tests/smoke_cli_scan.py

      - name: 'Smoke: index'
        working-directory: packages/pick-face
        run: python tests/smoke_cli_index.py

      - name: 'Smoke: link'
        working-directory: packages/pick-face
        run: python tests/smoke_cli_link.py

      - name: 'Smoke: report'
        working-directory: packages/pick-face
        run: python tests/smoke_cli_report.py

  smoke-windows:
    name: Smoke (windows)
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync project
        working-directory: packages/pick-face
        run: uv sync --frozen

      - name: 'Smoke: init-models refusal path'
        working-directory: packages/pick-face
        shell: bash
        run: python tests/smoke_cli_init_models.py

      - name: 'Smoke: scan'
        working-directory: packages/pick-face
        shell: bash
        run: python tests/smoke_cli_scan.py

      - name: 'Smoke: index'
        working-directory: packages/pick-face
        shell: bash
        run: python tests/smoke_cli_index.py

      - name: 'Smoke: link'
        working-directory: packages/pick-face
        shell: bash
        run: python tests/smoke_cli_link.py

      - name: 'Smoke: report'
        working-directory: packages/pick-face
        shell: bash
        run: python tests/smoke_cli_report.py

  smoke-macos:
    name: Smoke (macos)
    needs: unit
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync project
        working-directory: packages/pick-face
        run: uv sync --frozen

      - name: 'Smoke: init-models refusal path'
        working-directory: packages/pick-face
        run: python tests/smoke_cli_init_models.py

      - name: 'Smoke: scan'
        working-directory: packages/pick-face
        run: python tests/smoke_cli_scan.py

      - name: 'Smoke: index'
        working-directory: packages/pick-face
        run: python tests/smoke_cli_index.py

      - name: 'Smoke: link'
        working-directory: packages/pick-face
        run: python tests/smoke_cli_link.py

      - name: 'Smoke: report'
        working-directory: packages/pick-face
        run: python tests/smoke_cli_report.py

  # ---------------------------------------------------------------------------
  # 4. Benchmark — pick-face bench writes perf_report.{json,md}
  # ---------------------------------------------------------------------------
  bench:
    name: Benchmark
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev dependencies
        working-directory: packages/pick-face
        run: uv sync --extra dev --frozen

      - name: Run benchmark (small workload for CI)
        working-directory: packages/pick-face
        run: |
          mkdir -p .benchmarks/ci
          uv run python -m pick_face.bench --n-embeddings 2000 --k-people 10 --dim 128 --seed 0 \
            --out .benchmarks/ci || true
          # The bench module's CLI may not exist; if not, fall back to the python entry.
          if [ ! -f .benchmarks/ci/perf_report.json ]; then
            uv run python -c "from pick_face.bench import run_benchmark, write_report; from pathlib import Path; write_report(run_benchmark(n_embeddings=2000, k_people=10, dim=128, seed=0), Path('.benchmarks/ci'))"
          fi

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: packages/pick-face/.benchmarks/ci/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 6. Docs site — mkdocs build (M4 / T-303)
  # ---------------------------------------------------------------------------
  docs:
    name: Docs (mkdocs build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync with [docs] extra
        working-directory: packages/pick-face
        run: uv sync --extra docs --frozen

      - name: Build docs site (strict — fails on warnings)
        working-directory: packages/pick-face
        run: uv run mkdocs build --strict

      - name: Upload site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: packages/pick-face/site/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. AC-9 guard — dedicated job so it runs even if smoke is skipped
  #    The same guard runs inside `unit` (acceptance/test_no_model_in_distribution),
  #    but we promote it here so it can never silently disappear.
  # ---------------------------------------------------------------------------
  ac9:
    name: AC-9 (no *.onnx in distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync project
        working-directory: packages/pick-face
        run: uv sync --frozen

      - name: AC-9 guard
        working-directory: packages/pick-face
        run: |
          uv run python -m pytest tests/acceptance/test_no_model_in_distribution.py -v

      - name: Verify no Dockerfile bakes ONNX
        run: |
          if find . -name 'Dockerfile*' -not -path './.venv/*' -not -path './.git/*' -not -path './node_modules/*' -not -path '*/node_modules/*' -print -quit | grep -q .; then
            ! grep -rilE '\.onnx(\b|[^a-z])' --include='Dockerfile*' . || \
              (echo "AC-9 violation: Dockerfile references .onnx" && exit 1)
          fi
